# .streamlit/config.toml

[theme]
primaryColor = "#FF2D2B"       # Accent color for interactive elements
backgroundColor = "#131313"    # Page background color
secondaryBackgroundColor = "#1f1f1f" # Background for sidebar or secondary areas
textColor = "#FFF6EC"          # Main text color
font = "sans serif"            # Choose from: 'serif', 'sans serif', or 'monospace'

# this is needed for local development with docker
[server]
# you will need this for local development:
runOnSave = true
# you will need this if running docker on windows host:
fileWatcherType = "poll"
enableStaticServing = true